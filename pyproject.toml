[project]
name = "frames-extractor"
version = "0.1.0"
description = "Frame-mining CLI pipeline: find and export CCTV frames matching a plain-English query"
requires-python = ">=3.11"
dependencies = [
    "opencv-python>=4.9",
    "numpy>=1.26",
    "imagehash>=4.3.1",
    "torch==2.6.0+cu124",
    "transformers==5.14.1",
    "accelerate==1.14.0",
    "requests>=2.31",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.scripts]
frames_extractor = "backend.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["eval"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend", "src/vectordb", "src/frontend"]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
