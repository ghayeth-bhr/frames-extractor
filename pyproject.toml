[project]
name = "frames-extractor"
version = "0.1.0"
description = "Frame-mining CLI pipeline: find and export CCTV frames matching a plain-English query"
requires-python = ">=3.11"
dependencies = [
    "opencv-python>=4.9",
    "numpy>=1.26",
    "imagehash>=4.3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frames_extractor"]
